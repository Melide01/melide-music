<!doctype html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Consultez le curriculum vitae d'un auteur Melide.">
    <meta name="robots" content="index, follow, max-image-preview:large">
    <meta name="theme-color" content="#111111">
    <title>Curriculum vitae - Melide</title>
    <link rel="icon" href="/light-icon.ico" type="image/x-icon">
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="/cv/cv.css">
    <script defer src="/cv/script.js"></script>
</head>
<body class="cv_site">
    <header class="cv_site_header">
        <a class="cv_brand" href="/" aria-label="Retour à l’accueil Melide">
            <img src="/assets/mld_logo_all_white.png" alt="">
            <span>Melide</span>
        </a>
        <nav class="cv_header_actions" aria-label="Actions CV">

    <main id="cv-root" class="cv_page" aria-live="polite">

    <footer class="cv_site_footer">
        <a href="/">Melide · Accueil</a>
        <span>Curriculum vitae</span>
        <a href="/cv/edit/">Espace auteur</a>
